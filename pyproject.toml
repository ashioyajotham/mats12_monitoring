[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mats12-monitoring"
version = "0.1.0"
description = "Monitoring ordinary versus causally induced reasoning errors"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Victor Ashioya"}]
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.4,<2",
  "sympy>=1.13,<2",
]

[project.optional-dependencies]
dev = ["pyarrow>=18,<26", "pytest>=8,<9", "ruff>=0.6,<1"]
data = ["pyarrow>=18,<26"]
judge = ["openai>=1.40,<2"]
probe = ["torch>=2.2,<3", "transformers>=4.45,<6"]
tinker = ["tinker>=0.26.1,<1", "tinker-cookbook>=0.5.5,<1"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
